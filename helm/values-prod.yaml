# Prod overrides. The pipeline sets the image tag; secrets come from the Secret markets-env (MARKETS_ENV).
replicaCount: 1

env:
  APP_ENV: production
  # The issuer is the identity provider's public address as the browser sees it (https://<public host>/realms/chance).
  # The pipeline fills it in from the organization variable PUBLIC_HOST (host-values in .github/workflows/ci-cd.yml).
  # Left empty here on purpose: a deploy without it stops at start with "AUTH_ISSUER is required" instead of
  # rejecting every token (another "iss" is a 401).
  AUTH_ISSUER: ""

runtime:
  LOG_LEVEL: info
  MARKET_FUNDING_MIN: "100"
  MARKET_FUNDING_MAX: "100000"
  MARKET_MIN_LEAD_MS: "300000"
  AUTO_CLOSE_ENABLED: "true"
  AUTO_CLOSE_INTERVAL_MS: "15000"

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi
