{{- if .Values.networkPolicy.enabled }}
# Ingress: only the API gateway may reach the HTTP port (the smoke test Pod of this release is admitted as well), and
# only the monitoring namespace may reach the metrics port.
# Egress: PostgreSQL, NATS, the identity provider (signing keys, service token), trading's internal port and DNS;
# everything else is denied (plan section 9). The policy selects the service's Pods only, not the smoke test Pod, which
# carries the same selector labels but must reach the Service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "markets.fullname" . }}
  labels:
    {{- include "markets.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "markets.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values: ["smoke-test"]
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.gatewayNamespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.gatewayPodLabels | nindent 14 }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: smoke-test
      ports:
        - port: http
          protocol: TCP
    # Prometheus scrapes the metrics port; no other namespace may reach it.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.metrics.namespace | quote }}
      ports:
        - port: metrics
          protocol: TCP
  egress:
    # PostgreSQL: the service's database on the shared server (DM-01).
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.egress.postgres.podLabels | nindent 14 }}
      ports:
        - port: {{ .Values.networkPolicy.egress.postgres.port }}
          protocol: TCP
    # NATS: the outbox relay publishes, the TenantCreated consumer reads.
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.egress.nats.podLabels | nindent 14 }}
      ports:
        - port: {{ .Values.networkPolicy.egress.nats.port }}
          protocol: TCP
    # The identity provider: the signing keys of the tokens and the client-credentials token for trading.
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.egress.keycloak.podLabels | nindent 14 }}
      ports:
        - port: {{ .Values.networkPolicy.egress.keycloak.port }}
          protocol: TCP
    # Trading: only its internal port (the market funding call of the opening saga, DM-19).
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.egress.trading.podLabels | nindent 14 }}
      ports:
        - port: {{ .Values.trading.port }}
          protocol: TCP
    # DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.egress.dnsNamespaceLabels | nindent 14 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
