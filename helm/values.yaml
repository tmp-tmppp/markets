# Defaults, safe for a local cluster. values-dev.yaml and values-prod.yaml override them; the pipeline sets
# image.repository and image.tag (sha-<commit>) with --set-string and never puts secrets into values.

image:
  repository: docker.io/example/markets
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 8080

# Metrics (REQ-20): GET /metrics is served on a port of its own, never on service.port, so that the gateway can never
# route it. The port is rendered as METRICS_PORT and as the container port "metrics"; the Pod annotations
# prometheus.io/scrape, prometheus.io/port and prometheus.io/path tell Prometheus where to scrape. The Service does not
# expose it.
metrics:
  port: 9464

# Further Pod annotations (the prometheus.io ones come from metrics.port); the pipeline adds checksum/app-env so the Pods restart when the Secret changes.
podAnnotations: {}

# Secret settings (DATABASE_URL, MARKETS_CLIENT_SECRET) come from this Secret as environment variables.
# The pipeline creates it from the organization secret MARKETS_ENV; it is optional so the chart renders without it.
existingSecret: markets-env

# Non-secret startup settings, rendered into a ConfigMap (all values are strings). Changing one restarts the Pods,
# because the environment is read only at start. Every key is described in README.md. PORT, METRICS_PORT, TRADING_URL and
# RUNTIME_CONFIG_FILE are rendered by the chart from service.port, metrics.port, trading and the volume mount, and the four runtime
# keys have their own block below; the schema refuses all of them here, so one value never has two sources.
env:
  APP_ENV: production
  NATS_URL: nats://nats:4222
  KEYCLOAK_URL: http://identity:8080
  KEYCLOAK_REALM: chance
  MARKETS_CLIENT_ID: markets
  AUTH_JWKS_URL: http://identity:8080/realms/chance/protocol/openid-connect/certs
  AUTH_ISSUER: http://localhost:8081/realms/chance
  AUTH_AUDIENCE: chance
  AUTH_ROLES_CLAIM: realm_access.roles
  AUTH_TENANT_CLAIM: organization
  INTERNAL_AUTH_TENANTS_CLIENT_ID: tenants-markets
  DATABASE_POOL_MAX: "5"
  OUTBOX_POLL_MS: "300"
  # How long the MARKETS stream keeps its messages, in days (1 to 365). The relay keeps its published outbox rows as long
  # and the inbox a day longer, so every Chance service runs with the same value. 30 so that a service started later
  # still sees the older events: lower it back once every consumer is live (lowering it deletes the older messages from
  # the stream at the next start).
  STREAM_MAX_AGE_DAYS: "30"
  OPENING_RETRY_INTERVAL_MS: "5000"
  # The funding call to trading: timeout per attempt, retries after the first attempt, and the circuit breaker
  # (consecutive failures that open it, milliseconds until one call may try again).
  FUNDING_TIMEOUT_MS: "3000"
  FUNDING_RETRIES: "2"
  FUNDING_CIRCUIT_FAILURES: "5"
  FUNDING_CIRCUIT_HALF_OPEN_MS: "10000"
  RUNTIME_CONFIG_POLL_MS: "10000"
  # Drain after SIGTERM: readiness answers 503 and the Pod keeps serving for this long before it closes. It has to fit
  # into terminationGracePeriodSeconds (30 in the Deployment) together with the 10 seconds a close may take.
  SHUTDOWN_DELAY_MS: "5000"

# Trading's internal funding endpoint (POST /v1/internal/market-funding): TRADING_URL becomes
# http://<host>:<port>, and the NetworkPolicy opens exactly this port. The internal API sits on its own port because a
# NetworkPolicy filters by port, not by path (plan section 9); the gateway does not route it.
trading:
  host: trading
  port: 8081

# Runtime configuration (ADR-037): the keys the service applies while it runs, without a restart. They are rendered
# into the ConfigMap <release>-runtime, which the Pods mount as the directory /etc/markets/runtime (never as a subPath,
# which would never update). The Pods do NOT restart when it changes: the kubelet refreshes the mounted file within
# about a minute and the service reads it again every RUNTIME_CONFIG_POLL_MS. A key left out here keeps the
# service's default; the bounds are checked by the service, which keeps the old value for an invalid one and logs it.
runtime:
  LOG_LEVEL: info
  # Bounds of a market's funding amount (credits, the same unit as payments' amount); plan Q-10 is still open.
  MARKET_FUNDING_MIN: "100"
  MARKET_FUNDING_MAX: "100000"
  # How far ahead of now a new market's close time must lie (milliseconds, 5 minutes).
  MARKET_MIN_LEAD_MS: "300000"
  # The automatic close of markets at their close time (UC-15). AUTO_CLOSE_ENABLED is the kill switch: "false" closes
  # nothing; any value that is not "true" or "false" (a typo such as "flase", or an empty one) also switches it off.
  # AUTO_CLOSE_INTERVAL_MS (1000 to 3600000) is the wait between two runs over the tenants.
  AUTO_CLOSE_ENABLED: "true"
  AUTO_CLOSE_INTERVAL_MS: "15000"

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi

probes:
  startup:
    path: /health/startup
    periodSeconds: 2
    failureThreshold: 30
  readiness:
    path: /health/ready
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    path: /health/live
    periodSeconds: 10
    failureThreshold: 3

# Admits only the API gateway to the HTTP port and lets the Pods reach only what they need: PostgreSQL, NATS, the
# identity provider (signing keys and the service token), trading's internal port and DNS. Needs a network policy
# engine in the cluster (plan section 9). The destinations are Pods of the release's own namespace, selected by the
# labels below: check them against the shared PostgreSQL, NATS, identity and trading Pods before enabling it, because
# a wrong label blocks the service. A managed PostgreSQL outside the cluster would need an ipBlock rule instead.
networkPolicy:
  enabled: false
  gatewayNamespaceLabels:
    kubernetes.io/metadata.name: gateway
  gatewayPodLabels:
    app.kubernetes.io/name: traefik
  # The namespace of Prometheus (selected by its kubernetes.io/metadata.name label): admitted on the metrics port only.
  metrics:
    namespace: monitoring
  egress:
    postgres:
      podLabels:
        app.kubernetes.io/name: postgres
      port: 5432
    nats:
      podLabels:
        app.kubernetes.io/name: nats
      port: 4222
    keycloak:
      podLabels:
        app.kubernetes.io/name: identity
      port: 8080
    trading:
      podLabels:
        app.kubernetes.io/name: trading
    dnsNamespaceLabels:
      kubernetes.io/metadata.name: kube-system

# Smoke test run by "helm test" after every deploy: asks the readiness endpoint through the Service.
smokeTest:
  image: docker.io/library/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
