# Local dependencies of the markets service: PostgreSQL 18 and NATS with JetStream.
#   docker compose up -d
#   npm run build
#   APP_ENV=local DATABASE_URL=postgres://markets:markets@localhost:5432/markets NATS_URL=nats://localhost:4222 npm start
# The identity provider and trading are not part of this file: without TRADING_URL, APP_ENV=local funds a market with
# a fake client (FAKE_FUNDING_MODE=funded, insufficient or unknown). Tokens are still verified against AUTH_JWKS_URL.
# With a database, a tenant's schema is created only when its TenantCreated event arrives from the tenants service
# (start tenants against the same NATS), so a fresh database answers 503 tenant_not_ready until then; without
# DATABASE_URL the memory store provisions a tenant on its first request.
# The password below is a local development value only; real ones live in the Secret markets-env.
name: chance-markets

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: markets
      POSTGRES_USER: markets
      POSTGRES_PASSWORD: markets # hooks:allow local development only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markets -d markets"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.15.2-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data

volumes:
  postgres-data:
  nats-data:
