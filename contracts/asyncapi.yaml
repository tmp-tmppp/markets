asyncapi: 3.0.0
info:
  title: Chance markets events
  version: 0.1.0
  description: |
    Integration events published by the markets service to NATS JetStream, and the one event it consumes.

    - Format: CloudEvents 1.0, structured JSON mode. The message body is the whole CloudEvent.
    - Stream `MARKETS`: subjects `chance.markets.>`, file storage, limits retention, 30 days by default (STREAM_MAX_AGE_DAYS), duplicate
      window 2 minutes. The NATS message header `Nats-Msg-Id` carries the event `id`.
    - Subject of a message: `chance.markets.<Event>.<tenantId>`; CloudEvents subject `market/<marketId>`.
    - Delivery is at least once and the events of one market keep their order (one stream keeps the publish
      order, and the outbox relay publishes in the order of writing). Every event carries the market's `version`
      (DM-04): consumers update their copy only `WHERE version < new` and deduplicate by the event `id`.
    - Events carry ids, never the names or e-mails of people (DM-14). ShareLinkCreated and ShareLinkRevoked carry the
      id of the link, never its token and never the addresses of a `profiles` link; they have the same envelope, with
      the market's id in the CloudEvents subject, and the audit log records them without any change of its own.
    - Consumed: TenantCreated of the tenants service (stream `TENANTS`), through the durable pull consumer
      `markets`; it creates the tenant's schema in this service.
defaultContentType: application/json
servers:
  nats:
    host: nats:4222
    protocol: nats
    description: NATS server with JetStream, reached by its Kubernetes service name (localhost:4222 in local runs)

channels:
  marketOpened:
    address: chance.markets.MarketOpened.{tenantId}
    description: A market was funded by its creator and is open for trading
    parameters:
      tenantId:
        description: Id of the tenant (UUID)
    messages:
      MarketOpened:
        $ref: '#/components/messages/MarketOpened'
  marketClosed:
    address: chance.markets.MarketClosed.{tenantId}
    description: A market was closed; trading on it stops
    parameters:
      tenantId:
        description: Id of the tenant (UUID)
    messages:
      MarketClosed:
        $ref: '#/components/messages/MarketClosed'
  marketResolved:
    address: chance.markets.MarketResolved.{tenantId}
    description: A closed market was resolved with its outcome (YES, NO or INVALID)
    parameters:
      tenantId:
        description: Id of the tenant (UUID)
    messages:
      MarketResolved:
        $ref: '#/components/messages/MarketResolved'
  shareLinkCreated:
    address: chance.markets.ShareLinkCreated.{tenantId}
    description: A member made a share link for a market (the token and the e-mail addresses are never in the event)
    parameters:
      tenantId:
        description: Id of the tenant (UUID)
    messages:
      ShareLinkCreated:
        $ref: '#/components/messages/ShareLinkCreated'
  shareLinkRevoked:
    address: chance.markets.ShareLinkRevoked.{tenantId}
    description: An active share link was revoked
    parameters:
      tenantId:
        description: Id of the tenant (UUID)
    messages:
      ShareLinkRevoked:
        $ref: '#/components/messages/ShareLinkRevoked'
  tenantCreated:
    address: chance.tenants.TenantCreated.{tenantId}
    description: |
      Published by the tenants service (stream `TENANTS`, its contracts/asyncapi.yaml is the source). markets reads
      it with the durable pull consumer `markets` (filter `chance.tenants.TenantCreated.*`, explicit ack, deliver all,
      ack wait 30 s).
    parameters:
      tenantId:
        description: Id of the tenant (UUID)
    messages:
      TenantCreated:
        $ref: '#/components/messages/TenantCreated'

operations:
  publishMarketOpened:
    action: send
    channel:
      $ref: '#/channels/marketOpened'
    summary: Published in the transaction that opens the market (after trading funded it)
  publishMarketClosed:
    action: send
    channel:
      $ref: '#/channels/marketClosed'
    summary: Published in the transaction that closes the market
  publishMarketResolved:
    action: send
    channel:
      $ref: '#/channels/marketResolved'
    summary: Published in the transaction that resolves the market
  publishShareLinkCreated:
    action: send
    channel:
      $ref: '#/channels/shareLinkCreated'
    summary: Published in the transaction that stores a new share link
  publishShareLinkRevoked:
    action: send
    channel:
      $ref: '#/channels/shareLinkRevoked'
    summary: Published in the transaction that revokes an active share link
  receiveTenantCreated:
    action: receive
    channel:
      $ref: '#/channels/tenantCreated'
    summary: Creates and migrates the tenant's schema and registers the tenant
    description: |
      One transaction stores the event id in the inbox (a repeat changes nothing), creates the schema if it is
      missing, applies every tenant migration and registers the tenant; the message is acknowledged after the
      commit. A transient failure is negatively acknowledged with a delay. A malformed event or an unknown type is
      logged and acknowledged, so it cannot block the consumer.

components:
  messages:
    MarketOpened:
      name: MarketOpened
      title: Market opened
      contentType: application/json
      headers:
        $ref: '#/components/schemas/NatsHeaders'
      payload:
        $ref: '#/components/schemas/MarketOpenedEvent'
    MarketClosed:
      name: MarketClosed
      title: Market closed
      contentType: application/json
      headers:
        $ref: '#/components/schemas/NatsHeaders'
      payload:
        $ref: '#/components/schemas/MarketClosedEvent'
    MarketResolved:
      name: MarketResolved
      title: Market resolved
      contentType: application/json
      headers:
        $ref: '#/components/schemas/NatsHeaders'
      payload:
        $ref: '#/components/schemas/MarketResolvedEvent'
    ShareLinkCreated:
      name: ShareLinkCreated
      title: Share link created
      contentType: application/json
      headers:
        $ref: '#/components/schemas/NatsHeaders'
      payload:
        $ref: '#/components/schemas/ShareLinkCreatedEvent'
    ShareLinkRevoked:
      name: ShareLinkRevoked
      title: Share link revoked
      contentType: application/json
      headers:
        $ref: '#/components/schemas/NatsHeaders'
      payload:
        $ref: '#/components/schemas/ShareLinkRevokedEvent'
    TenantCreated:
      name: TenantCreated
      title: Tenant created (consumed)
      contentType: application/json
      headers:
        $ref: '#/components/schemas/NatsHeaders'
      payload:
        $ref: '#/components/schemas/TenantCreatedEvent'

  schemas:
    NatsHeaders:
      type: object
      required: [Nats-Msg-Id]
      properties:
        Nats-Msg-Id:
          type: string
          format: uuid
          description: Equals the CloudEvent id; JetStream drops a repeated id inside the duplicate window
    Outcome:
      type: string
      enum: ['YES', 'NO', 'INVALID']
      description: |
        `YES` or `NO`: the answer; winning shares pay one credit each. `INVALID` (UC-16): the question cannot be answered;
        the market is still resolved, and trading refunds every trader's net stake and returns the rest of the funding to
        the creator (no winners). A consumer must accept all three values.
    CloudEventEnvelope:
      type: object
      description: CloudEvents 1.0 attributes shared by all events of this service
      required:
        - specversion
        - id
        - source
        - type
        - subject
        - time
        - datacontenttype
        - tenantid
        - correlationid
        - causationid
        - data
      properties:
        specversion:
          type: string
          const: '1.0'
        id:
          type: string
          format: uuid
          description: UUIDv7, the deduplication key
        source:
          type: string
          const: /chance/markets
        type:
          type: string
          pattern: '^si\.chance\.markets\.[A-Za-z]+\.v[0-9]+$'
        subject:
          type: string
          pattern: '^market/'
          description: '`market/<marketId>`'
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          const: application/json
        tenantid:
          type: string
          format: uuid
          description: Tenant context (extension attribute)
        correlationid:
          type: string
          minLength: 1
          description: Id that ties the events of one business operation together (extension attribute)
        causationid:
          type: string
          minLength: 1
          description: Id of the request that caused the event (extension attribute)
        data:
          type: object
    MarketOpenedData:
      type: object
      additionalProperties: false
      required: [marketId, question, closeTime, startingPrice, fundingAmount, creatorId, version, openedAt]
      properties:
        marketId:
          type: string
          format: uuid
        question:
          type: string
          minLength: 10
          maxLength: 200
        closeTime:
          type: string
          format: date-time
        startingPrice:
          type: number
          minimum: 0.01
          maximum: 0.99
          description: Starting price of YES, two decimals; NO starts at 1 - startingPrice
        fundingAmount:
          type: integer
          minimum: 1
          description: Credits the creator paid (1 credit, the unit of payments' amount)
        creatorId:
          type: string
          description: Subject of the tenant admin who created and funded the market
        version:
          type: integer
          minimum: 1
        openedAt:
          type: string
          format: date-time
    MarketClosedData:
      type: object
      additionalProperties: false
      required: [marketId, version, closedAt, closedBy]
      properties:
        marketId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        closedAt:
          type: string
          format: date-time
        closedBy:
          type: string
          description: |
            Subject of the tenant admin who closed the market, or the fixed value `system:auto-close` when the service closed
            the market itself because its closeTime had passed (UC-15). The field is always a string; the fixed value is not an
            identity provider subject, so a consumer can tell the two apart. Do not parse it as a UUID.
          examples:
            - system:auto-close
    MarketResolvedData:
      type: object
      additionalProperties: false
      required: [marketId, outcome, version, resolvedAt, resolvedBy, creatorId]
      properties:
        marketId:
          type: string
          format: uuid
        outcome:
          $ref: '#/components/schemas/Outcome'
        version:
          type: integer
          minimum: 1
        resolvedAt:
          type: string
          format: date-time
        resolvedBy:
          type: string
          description: Subject of the tenant admin who resolved the market
        creatorId:
          type: string
    ShareLinkCreatedData:
      type: object
      additionalProperties: false
      required: [marketId, shareLinkId, linkType, actorId, expiresAt]
      properties:
        marketId:
          type: string
          format: uuid
        shareLinkId:
          type: string
          format: uuid
          description: Id of the link; never its token
        linkType:
          type: string
          enum: [members, profiles, everyone]
        actorId:
          type: string
          description: Subject of the user who made the link (the audit log reads this key as the actor)
        expiresAt:
          type: [string, 'null']
          format: date-time
    ShareLinkRevokedData:
      type: object
      additionalProperties: false
      required: [marketId, shareLinkId, actorId, revokedAt]
      properties:
        marketId:
          type: string
          format: uuid
        shareLinkId:
          type: string
          format: uuid
        actorId:
          type: string
          description: Subject of the user who revoked the link
        revokedAt:
          type: string
          format: date-time
    ShareLinkCreatedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          properties:
            type:
              const: si.chance.markets.ShareLinkCreated.v1
            data:
              $ref: '#/components/schemas/ShareLinkCreatedData'
    ShareLinkRevokedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          properties:
            type:
              const: si.chance.markets.ShareLinkRevoked.v1
            data:
              $ref: '#/components/schemas/ShareLinkRevokedData'
    MarketOpenedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          properties:
            type:
              const: si.chance.markets.MarketOpened.v1
            data:
              $ref: '#/components/schemas/MarketOpenedData'
    MarketClosedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          properties:
            type:
              const: si.chance.markets.MarketClosed.v1
            data:
              $ref: '#/components/schemas/MarketClosedData'
    MarketResolvedEvent:
      allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          properties:
            type:
              const: si.chance.markets.MarketResolved.v1
            data:
              $ref: '#/components/schemas/MarketResolvedData'
    TenantCreatedEvent:
      type: object
      description: |
        What markets reads of the tenants service's TenantCreated (the full schema is in the tenants contract). Any
        other field is ignored, so new optional fields never break this consumer.
      required: [specversion, id, type, tenantid]
      properties:
        specversion:
          type: string
          const: '1.0'
        id:
          type: string
          format: uuid
          description: The inbox deduplication key
        type:
          type: string
          const: si.chance.tenants.TenantCreated.v1
        tenantid:
          type: string
          format: uuid
          description: The tenant whose schema is created; taken from here, never from the data alone
        correlationid:
          type: string
        data:
          type: object
          properties:
            tenantId:
              type: string
              format: uuid
              description: When present, it must equal `tenantid`, otherwise the event is malformed and skipped
            name:
              type: string
              description: The organization's display name, kept for the public lookup of a share link; an absent or empty name is not kept
